{% set name = "gaiaxpy" %}
{% set version = "2.2.0" %}
{% set readme = load_file_regex(load_file="README.md", regex_pattern="(?s).*") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gaiaxpy-{{ version }}.tar.gz
  sha256: 7ec15fd1ccbc6d6d4f6fe19b92f1f430bb5c982890f261199cbcbf5ef94a9cc2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - aenum
    - astropy-base >=5.3.3,!=7.0.0,!=7.0.1
    - astroquery
    - fastavro
    - python-hdfs
    - joblib
    - matplotlib-base
    - numpy >1.23
    - packaging
    - pandas >=1.5.0
    - scipy >=1.10
    - tqdm >=4.66.3

test:
  imports:
    - gaiaxpy
  commands:
    - pip check
    - python -c "from gaiaxpy import PhotometricSystem; assert PhotometricSystem.DR3_JKC is not None"
  requires:
    - python {{ python_min }}.*
    - pip

about:
  home: https://gaia-dpci.github.io/GaiaXPy-website/
  summary: GaiaXPy is a Python library to facilitate handling Gaia BP/RP spectra as distributed from the Gaia archive.
  description: {{ (readme.group(0) if readme else "") | tojson }}
  license: 'BSD-3-Clause'
  license_file: LICENCE

extra:
  recipe-maintainers:
    - cgobat
    - druzm
    - fdeangeli
    - mwittgen
    - roceb
