{% set name = "gaiaxpy" %}
{% set version = "2.1.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gaiaxpy-{{ version }}.tar.gz
  sha256: 17f05e1438a8228e3d960fd6ee6f54e1a497a549acdfce2151fbcffc65e1e260

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - aenum
    - astropy-base >=5.3.3,!=7.0.0,!=7.0.1
    - astroquery
    - fastavro
    - python-hdfs
    - matplotlib-base
    - numpy >1.23
    - packaging
    - pandas >=1.5.0
    - scipy
    - tqdm >=4.66.3

test:
  imports:
    - gaiaxpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}.*
    - pip

about:
  home: https://gaia-dpci.github.io/GaiaXPy-website/
  summary: GaiaXPy is a Python library to facilitate handling Gaia BP/RP spectra as distributed from the Gaia archive.
  license: 'BSD-3-Clause'
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cgobat
    - druzm
    - mwittgen
    - roceb
